{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Process Equipment Return</h4>
            </div>
            <div class="card-body p-4">
                <div class="mb-4 p-3 bg-light rounded border">
                    <h5>Booking Details</h5>
                    <p class="mb-1"><strong>Booking ID:</strong> #{{ booking.id }}</p>
                    <p class="mb-1"><strong>Student Name:</strong> {{ booking.student_name }}</p>
                    <p class="mb-1"><strong>Equipment:</strong> {{ booking.equipment_name }}</p>
                    <p class="mb-1"><strong>Booking Date:</strong> {{ booking.booking_date }}</p>
                </div>

                <form action="{{ url_for('return_equipment', booking_id=booking.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="condition" class="form-label">Equipment Condition</label>
                        <select class="form-select" id="condition" name="condition" required>
                            <option value="Good">Good</option>
                            <option value="Minor Damage">Minor Damage</option>
                            <option value="Damaged">Damaged</option>
                            <option value="Needs Maintenance">Needs Maintenance</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="remarks" class="form-label">Remarks (Optional)</label>
                        <textarea class="form-control" id="remarks" name="remarks" rows="3"></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_returns') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Mark as Returned</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
