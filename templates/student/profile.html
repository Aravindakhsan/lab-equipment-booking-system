{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0" style="border-radius: var(--radius-md);">
            <div class="card-body p-5 text-center">
                <div class="avatar-circle mx-auto mb-4 bg-primary-subtle text-primary" style="width: 120px; height: 120px; font-size: 3rem; background-color: var(--frost-mist); color: var(--deep-winter-blue);">
                    {{ user.name[:1] | upper }}
                </div>
                
                <h3 class="fw-bold mb-1" style="color: var(--frost-navy);">{{ user.name }}</h3>
                <p class="text-secondary mb-4">{{ user.role | capitalize }}</p>
                
                <div class="bg-light rounded p-4 text-start mb-4">
                    <div class="row mb-3">
                        <div class="col-sm-4 text-secondary fw-bold">Email Address</div>
                        <div class="col-sm-8 fw-bold">{{ user.email }}</div>
                    </div>
                    <div class="row">
                        <div class="col-sm-4 text-secondary fw-bold">Department</div>
                        <div class="col-sm-8 fw-bold">{{ user.department }}</div>
                    </div>
                </div>
                
                <div class="d-grid">
                    <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-primary btn-lg fw-bold"><i class="bi bi-arrow-left me-2"></i>Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
