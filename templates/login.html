{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-center align-items-center w-100 h-100">
    <div class="auth-card">
        <div class="auth-brand">
            <i class="bi bi-flask"></i>
            <h2>LabBook System</h2>
            <p class="mt-3 text-white-50">Streamline your laboratory workflow with our modern booking management platform.</p>
        </div>
        <div class="auth-form-section">
            <h3 class="fw-bold mb-4" style="color: var(--frost-navy);">Welcome Back</h3>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@university.edu" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-primary btn-lg">Log In</button>
                </div>
            </form>
            <div class="text-center">
                <p class="mb-0 text-secondary">Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold" style="color: var(--deep-winter-blue);">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
